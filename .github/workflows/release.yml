# A release of chat is built, signed and published by the Publish workflow, once an admin
# approves it. This checks each one once it's out, as anyone could: its SHA256SUMS signed with a
# key in keys/ as that version's, every binary matching it, and the binaries built again from the
# tag giving the same bytes (apart from the list of builds signed into each). chat-core's releases,
# tagged chat-core-vVERSION, have no binaries to check.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The release to check, as its tag (vVERSION)
        required: true
  # From the Publish workflow, whose releases don't start this by themselves.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  # As in build.yml, which these must match.
  ZIG_VERSION: 0.16.0
  ZIGBUILD_VERSION: 0.24.1
  JUST_VERSION: 1.58.0

jobs:
  verify:
    name: Signed, and the binaries match
    if: github.repository == 'chat-labs/chat' && startsWith(github.event.release.tag_name || inputs.version, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: A release tag
        run: echo "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
      # The keys as the release had them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -yq minisign
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just verify "$VERSION"

  reproduce:
    name: Built again from the tag, the same
    if: github.repository == 'chat-labs/chat' && startsWith(github.event.release.tag_name || inputs.version, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: A release tag
        run: echo "$VERSION" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}
      - run: just reproduce "$VERSION"
