# Starts a release, or a beta: `just prepare` moves the changelog's open sections under the new
# version and puts it in Cargo.toml, and this opens them as a "Release VERSION" pull request.
# Merging it publishes nothing. `just release`, on the maintainer's machine, then tags the merged
# commit, builds, signs and publishes it, so the release key never comes near GitHub and a
# compromised account or workflow can't sign an update chat will install.
#
# A pull request this workflow's token opens starts no workflows, so CI checks the release commit
# once it's merged, on main.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "patch, minor, major or a version (empty: Cargo.toml's, which finishes its betas)"
        type: string
        default: ""
      beta:
        description: A beta of it, not the release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.58.0

jobs:
  prepare:
    name: Release pull request
    if: github.repository == 'chat-labs/chat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Every tag too, which numbers the betas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Cargo.lock gets the new version offline, from what this fetches.
      - run: cargo fetch --locked
      - name: Changelog and version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          BETA: ${{ inputs.beta }}
        run: |
          if [ "$BETA" = true ]; then set -- beta; else set --; fi
          v=$(just prepare "$@" ${KIND:+"$KIND"})
          echo "$v" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Pull request
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/v$V"
          git commit -qam "Release $V"
          git push origin "release/v$V"
          gh pr create --base main --head "release/v$V" --title "Release $V" --body "$(cat <<EOF
          The changelog's open sections under $V, and $V in Cargo.toml and Cargo.lock.

          Merging this publishes nothing. Then, on main with the merge pulled, \`just release\`
          tags it v$V, builds, signs and publishes it.
          EOF
          )"
