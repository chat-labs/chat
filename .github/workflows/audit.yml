# Known vulnerabilities (the RustSec advisory database) in what Cargo.lock builds: when the
# dependencies change, and each day, since advisories come out for what's already in it.
name: Audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      # Vulnerabilities fail it; unmaintained and yanked crates are warnings, shown in the log.
      - run: cargo audit
