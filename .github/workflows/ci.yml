# Every pull request and every push to main, for every crate in the workspace (each job takes
# --workspace, so a new one is in them at once): formatting and clippy, the tests on Linux, Windows
# and macOS, chat-json for chat-apk's Android ABIs, the oldest Rust the crates say they build with,
# and the API docs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0
      # Cargo.lock is as the manifests want it: nothing below may change it.
      - run: cargo fetch --locked
      - run: just lint

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0
      - run: cargo fetch --locked
      # Every target, so one failing doesn't hide the rest.
      - run: just test --locked --no-fail-fast

  macos:
    name: Clippy and tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast

  # The Windows release is built on Linux with zig (`just dist`), so its tests are built the same
  # way, here, and then run on Windows itself.
  windows-build:
    name: Clippy and test build (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-gnu
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-zigbuild@0.24.1
      - run: cargo fetch --locked
      - run: cargo-zigbuild clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Build the tests
        run: |
          cargo zigbuild --locked --workspace --tests --target x86_64-pc-windows-gnu --message-format=json-render-diagnostics > build.json
          mkdir win-tests
          # Each test program, with the package folder it runs in (its tests read files from there).
          jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null)
                 | "\(.manifest_path | split("/") | .[-2]) \(.executable)"' build.json |
          while read -r pkg exe; do
            cp "$exe" win-tests/
            echo "$pkg $(basename "$exe")" >> win-tests/list
          done
          cat win-tests/list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests
          path: win-tests/
          retention-days: 3
          if-no-files-found: error

  windows-test:
    name: Tests (Windows)
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests
          path: win-tests
      - name: Run the tests
        shell: bash
        run: |
          failed=0
          while read -r pkg exe; do
            echo "::group::$pkg: $exe"
            (cd "$pkg" && "../win-tests/$exe") || { failed=1; echo "::error::$pkg: $exe failed"; }
            echo "::endgroup::"
          done < win-tests/list
          exit "$failed"

  # chat-apk runs chat-json as each room's process, built by `just core::android` with the NDK its
  # app/build.gradle.kts names: built here too, so a change that breaks it shows up in this pull
  # request rather than in chat-apk's next build.
  android:
    name: chat-json for Android (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: The NDK chat-apk builds with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0
      - run: just core::android "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

  msrv:
    name: Oldest Rust (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Rust the crates' rust-version names
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' chat-core/Cargo.toml)
          rustup toolchain install "$v" --profile minimal
          echo "MSRV=$v" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo "+$MSRV" check --locked --workspace --all-targets

  docs:
    name: API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
