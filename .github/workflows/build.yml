# The release binaries (`just dist`), built twice from the same commit on two different systems in
# two different folders, each binary in a job of its own so they build at once, which must give
# the same bytes: releases are signed offline, and anyone
# can check a published one against the source only because the build is reproducible. The
# binaries are kept as artifacts, unsigned: chat's updater installs only what the release key signed.
#
# Rust comes from rust-toolchain.toml; zig and cargo-zigbuild are pinned here. A release built
# with others won't match what this builds, so they change together.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - macos-sdk/**
      - justfile
      - .github/workflows/build.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.16.0
  ZIGBUILD_VERSION: 0.24.1
  JUST_VERSION: 1.58.0

jobs:
  dist:
    name: ${{ matrix.binary }} (${{ matrix.os }}, ${{ matrix.folder }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        build: [first, second]
        # The justfile's binaries.
        binary: [chat-linux-x86_64, chat-windows-x86_64.exe, chat-macos-aarch64, chat-macos-x86_64]
        include:
          - build: first
            os: ubuntu-24.04
            folder: first
          - build: second
            os: ubuntu-26.04
            folder: second/elsewhere
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.folder }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@${{ env.JUST_VERSION }},cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}
      # No cache: each build starts from nothing, as one checking a release would.
      - run: just _dist-build "$BINARY"
        env:
          BINARY: ${{ matrix.binary }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.build }}-${{ matrix.binary }}
          path: ${{ matrix.folder }}/dist/${{ matrix.binary }}
          retention-days: 30
          if-no-files-found: error

  reproducible:
    name: The same bytes both times
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: first-*
          path: first
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: second-*
          path: second
          merge-multiple: true
      - run: |
          (cd first && sha256sum -- *) > first.sums
          (cd second && sha256sum -- *) > second.sums
          {
            echo '### Release binaries of this commit (unsigned)'
            echo '```'
            cat first.sums
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! diff first.sums second.sums; then
            echo "::error::two builds of the same commit differ - the build isn't reproducible"
            exit 1
          fi

  # The Mac builds are cross-built against macos-sdk/'s stubs, so only a Mac shows the frameworks
  # they name load. Intel's runs under Rosetta.
  macos:
    name: The Mac builds start on a Mac
    needs: dist
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: first-chat-macos-*
          merge-multiple: true
      - run: |
          chmod +x chat-macos-aarch64 chat-macos-x86_64
          ./chat-macos-aarch64 --version
          arch -x86_64 ./chat-macos-x86_64 --version
      # A release appends its list of builds after each binary's code signature.
      - run: |
          for f in chat-macos-aarch64 chat-macos-x86_64; do printf 'chat v0\n%08dCHATBLD1' 8 >> "$f"; done
          ./chat-macos-aarch64 --version
          arch -x86_64 ./chat-macos-x86_64 --version
