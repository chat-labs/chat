# Weekly pull requests for the workflows' actions (pinned by commit) and the crates. Each goes
# through CI, E2E and the audit like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      crates:
        update-types: [minor, patch]
    ignore:
      # Arti is pinned exactly, since chat relies on its details: it moves on in a commit of its
      # own, with its changes read.
      - dependency-name: arti-client
      - dependency-name: "tor-*"
