[workspace]
members = ["chat-core", "chat-tui"]
resolver = "3"

# One version for every crate: `just release` sets it.
[workspace.package]
version = "0.6.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"

# Maximum optimization for final distribution binaries
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
